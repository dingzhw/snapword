<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词哒 · SnapWord — 趣味拆词与父子伴学工作台</title>
  <style>:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-soft: #eef2f8;
  --ink: #132238;
  --ink-muted: #52637a;
  --border: #d5dfec;
  --board-bg: #132238;
  --board-ink: #f8fafc;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --accent-amber: #f59e0b;
  --accent-amber-soft: #fef3c7;
  --mint: #10b981;
  --mint-soft: #d1fae5;
  --coral: #ef4444;
  --coral-soft: #fee2e2;
  --gold: #eab308;
  --silver: #64748b;
  --bronze: #b45309;
  --radius-lg: 18px;
  --radius-md: 12px;
  --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-en: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background-color: var(--bg);
  background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: 16px;
}

.english {
  font-family: var(--font-en);
  letter-spacing: 0.035em;
}

/* Top Navigation Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 2px solid var(--border);
  backdrop-filter: blur(8px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: linear-gradient(135deg, #2563eb, #0ea5e9);
  color: #fff;
  font-weight: 900;
  font-size: 23px;
  box-shadow: 0 4px 0 #1e40af;
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.2;
}

.brand-en {
  font-family: var(--font-en);
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-left: 4px;
}

.brand-sub {
  font-size: 12.5px;
  color: var(--ink-muted);
}

.main-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav-btn {
  border: 2px solid transparent;
  background: var(--surface-soft);
  color: var(--ink);
  font-weight: 700;
  padding: 9px 15px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.15s ease;
}

.nav-btn:hover { background: #e2e8f0; }
.nav-btn.active {
  background: var(--ink);
  color: #fff;
  box-shadow: 0 3px 0 #09111e;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.actor-pill {
  border: 2px solid #059669;
  background: var(--mint-soft);
  color: #065f46;
  font-weight: 800;
  font-size: 14px;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
}

.actor-pill.demo {
  border-color: #d97706;
  background: var(--accent-amber-soft);
  color: #92400e;
}

.save-dot {
  font-size: 13px;
  font-weight: 600;
  color: #059669;
}

.demo-banner {
  background: repeating-linear-gradient(-45deg, #fef3c7, #fef3c7 14px, #fde68a 14px, #fde68a 28px);
  color: #78350f;
  padding: 9px 20px;
  text-align: center;
  font-size: 14.5px;
  border-bottom: 2px solid #f59e0b;
}

/* Main Container */
.container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 22px 20px 64px;
}

/* Cards & Common Layout */
.card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: 0 6px 18px rgba(19, 34, 56, 0.05);
  margin-bottom: 18px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.between { justify-content: space-between; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

/* Tactile 3D Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 13px;
  border: 2px solid var(--border);
  background: #fff;
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--border);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s;
}

.btn:hover:not(:disabled) { transform: translateY(-1px); background: #f8fafc; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--primary);
  border-color: var(--primary-dark);
  color: #fff;
  box-shadow: 0 4px 0 var(--primary-dark);
}
.btn-primary:hover:not(:disabled) { background: #3b82f6; }

.btn-mint {
  background: var(--mint);
  border-color: #047857;
  color: #fff;
  box-shadow: 0 4px 0 #047857;
}
.btn-mint:hover:not(:disabled) { background: #059669; }

.btn-amber {
  background: #fbbf24;
  border-color: #b45309;
  color: #451a03;
  box-shadow: 0 4px 0 #b45309;
}
.btn-amber:hover:not(:disabled) { background: #fcd34d; }

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 14px;
  border-radius: 10px;
}

/* Badge Stats Strip */
.badge-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.stat-tile {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 15px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.medal-icon {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  flex-shrink: 0;
}
.medal-gold { background: #fef08a; border: 2px solid #eab308; color: #854d0e; }
.medal-silver { background: #e2e8f0; border: 2px solid #94a3b8; color: #334155; }
.medal-bronze { background: #ffedd5; border: 2px solid #d97706; color: #9a3412; }
.medal-due { background: #dbeafe; border: 2px solid #3b82f6; color: #1e40af; }

.stat-num { font-size: 26px; font-weight: 900; line-height: 1.1; }
.stat-label { font-size: 13px; color: var(--ink-muted); }

/* Step Progress Stepper + Role Tag */
.session-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 12px 18px;
  margin-bottom: 16px;
}

.step-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.step-pill {
  padding: 7px 13px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: var(--surface-soft);
  color: var(--ink-muted);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.step-pill.active {
  background: var(--primary);
  border-color: var(--primary-dark);
  color: #fff;
}
.step-pill.done {
  background: var(--mint-soft);
  border-color: #10b981;
  color: #065f46;
}

.role-indicator {
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 800;
  background: #eff6ff;
  color: #1e40af;
  border: 1.5px dashed #60a5fa;
}

/* Blackboard & Slot Machine (Step 2) */
.blackboard {
  background: var(--board-bg);
  color: var(--board-ink);
  border: 4px solid #334155;
  border-radius: 20px;
  padding: 26px;
  box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(19, 34, 56, 0.12);
  margin-bottom: 18px;
}

.board-sentence {
  font-size: clamp(26px, 3.6vw, 38px);
  font-weight: 800;
  line-height: 1.4;
  margin: 14px 0 10px;
  word-spacing: 0.14em;
}

.board-hl {
  background: #fbbf24;
  color: #1e293b;
  padding: 2px 10px;
  border-radius: 10px;
  box-shadow: 0 3px 0 #b45309;
}

.board-zh {
  font-size: 18px;
  color: #cbd5e1;
  margin: 0 0 16px;
}

.slot-reels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.reel-box {
  background: #1e293b;
  border: 2px solid #475569;
  border-radius: 14px;
  padding: 12px 14px;
}
.reel-label {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 700;
  margin-bottom: 6px;
}
.reel-select {
  width: 100%;
  background: #0f172a;
  color: #f8fafc;
  border: 1.5px solid #64748b;
  border-radius: 9px;
  padding: 8px 10px;
  font-weight: 700;
}

/* Snap-Block Magnetic Forging Stage (Step 3) */
.word-hero {
  text-align: center;
  padding: 12px 12px;
  background: linear-gradient(180deg, #f8fafc, #eff6ff);
  border: 2px solid #bfdbfe;
  border-radius: 16px;
  margin-bottom: 12px;
}

.word-zh-big {
  font-size: clamp(22px, 2.6vw, 28px);
  font-weight: 900;
  margin: 2px 0 4px;
}

.chunk-display {
  display: inline-block;
  font-size: clamp(28px, 3.6vw, 40px);
  font-weight: 900;
  color: var(--primary-dark);
  background: #fff;
  padding: 5px 20px;
  border-radius: 14px;
  border: 2px solid #93c5fd;
  margin: 4px 0;
}

.audio-tag {
  display: inline-block;
  font-size: 12.5px;
  color: var(--ink-muted);
  background: var(--surface-soft);
  padding: 4px 10px;
  border-radius: 999px;
  margin-left: 8px;
}

.help-callout {
  background: #fffbeb;
  border-left: 5px solid #f59e0b;
  padding: 9px 14px;
  border-radius: 10px;
  margin: 8px 0;
  font-size: 15px;
}

.bridge-callout {
  background: #f0fdf4;
  border-left: 5px solid #10b981;
  padding: 8px 14px;
  border-radius: 10px;
  margin: 8px 0;
  font-size: 14.5px;
}

.snap-tray {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  min-height: 66px;
  padding: 12px;
  background: var(--ink);
  border-radius: 15px;
  margin: 10px 0;
}

.snap-slot {
  min-width: 72px;
  height: 54px;
  padding: 0 16px;
  border-radius: 12px;
  border: 2px dashed #64748b;
  color: #94a3b8;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 800;
}

.snap-slot.filled {
  border-style: solid;
  border-color: #34d399;
  background: #ecfdf5;
  color: #065f46;
  box-shadow: 0 4px 0 #059669;
  cursor: pointer;
  animation: snapPop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.snap-pool {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.magnet-tile {
  min-width: 74px;
  min-height: 56px;
  padding: 10px 20px;
  font-size: 24px;
  font-weight: 900;
  border-radius: 14px;
  border: 2px solid #1e40af;
  background: #eff6ff;
  color: #1e3a8a;
  box-shadow: 0 5px 0 #1e40af;
  cursor: pointer;
  transition: transform 0.1s ease;
}
.magnet-tile.space-tile {
  background: #e0f2fe;
  border-color: #0284c7;
  color: #0369a1;
  box-shadow: 0 5px 0 #0284c7;
  font-size: 18px;
}
.magnet-tile:hover:not(:disabled) { transform: translateY(-2px); background: #dbeafe; }
.magnet-tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #1e40af; }
.magnet-tile.used { opacity: 0.25; pointer-events: none; }
.magnet-tile.wobble { animation: tileWobble 0.36s ease; background: var(--coral-soft); border-color: var(--coral); color: #991b1b; }

.bounce-bubble {
  background: #fef3c7;
  border: 2px solid #f59e0b;
  color: #78350f;
  font-weight: 800;
  padding: 12px 16px;
  border-radius: 14px;
  text-align: center;
  margin: 10px 0;
}

.cloze-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 28px;
  font-weight: 800;
  margin: 16px 0;
}

.cloze-input {
  width: 150px;
  font-size: 26px;
  font-weight: 800;
  text-align: center;
  padding: 8px 12px;
  border: 3px solid var(--primary);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
}

/* Bug Hunter Detective Card (Step 4) */
.bug-sentence {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 20px;
  background: #1e293b;
  border-radius: 16px;
  margin: 14px 0;
}

.bug-token {
  padding: 8px 15px;
  font-size: 24px;
  font-weight: 800;
  border-radius: 11px;
  background: #334155;
  color: #f8fafc;
  border: 2px solid #475569;
  cursor: pointer;
}
.bug-token:hover { border-color: #93c5fd; }
.bug-token.squashed {
  background: #065f46;
  border-color: #34d399;
  color: #ecfdf5;
}
.bug-token.picking {
  background: #991b1b;
  border-color: #f87171;
  color: #fff;
}

/* Two-Pass Red-Pen Paper Station (Step 5) */
.paper-list {
  display: grid;
  gap: 14px;
  margin: 16px 0;
}

.paper-item {
  border: 2px solid var(--border);
  border-radius: 15px;
  padding: 16px 20px;
  background: #fff;
}

.blind-check-card {
  background: #fff1f2;
  border: 2px solid #fda4af;
  border-radius: 16px;
  padding: 18px 20px;
  margin: 14px 0;
}

.blind-check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 800;
  color: #881337;
  padding: 10px 0;
  cursor: pointer;
}
.blind-check-row input[type="checkbox"] {
  width: 24px;
  height: 24px;
  accent-color: #e11d48;
}

.four-line-answer {
  font-size: 30px;
  font-weight: 900;
  color: #0f172a;
  padding: 8px 16px;
  background: repeating-linear-gradient(
    to bottom,
    #f8fafc 0px,
    #f8fafc 13px,
    #cbd5e1 14px,
    #f8fafc 15px
  );
  border: 2px solid #94a3b8;
  border-radius: 11px;
  display: inline-block;
  margin: 8px 0;
}

.outcome-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.outcome-btn {
  padding: 8px 13px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--surface-soft);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.outcome-btn.selected-good { background: var(--mint-soft); border-color: #059669; color: #065f46; }
.outcome-btn.selected-fix { background: var(--accent-amber-soft); border-color: #d97706; color: #78350f; }
.outcome-btn.selected-bad { background: var(--coral-soft); border-color: #dc2626; color: #991b1b; }
.outcome-btn.selected-pending { background: #dbeafe; border-color: #2563eb; color: #1e3a8a; }

.paper-item.unjudged-highlight {
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
}

.alloc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.alloc-col {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.alloc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
}
.alloc-item:last-child { border-bottom: none; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal-card {
  background: #fff;
  border-radius: 18px;
  border: 2px solid var(--border);
  max-width: 500px;
  width: 100%;
  padding: 24px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  border: 1.5px solid var(--border);
  background: #f8fafc;
  cursor: pointer;
}
.tag-chip.active {
  background: #fee2e2;
  border-color: #ef4444;
  color: #991b1b;
  font-weight: 700;
}

/* Inputs & Forms */
input[type="text"], input[type="number"], select, textarea {
  padding: 9px 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
}
textarea { width: 100%; min-height: 110px; resize: vertical; }

.muted { color: var(--ink-muted); font-size: 14px; }
.pill {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--surface-soft);
  color: var(--ink-muted);
}
.pill-core { background: #dbeafe; color: #1e40af; }
.pill-star { background: #fef3c7; color: #92400e; }

.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;
  max-width: 380px;
  background: var(--ink);
  color: #fff;
  padding: 13px 18px;
  border-radius: 13px;
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
  z-index: 90;
}

@keyframes snapPop {
  0% { transform: scale(0.84); }
  100% { transform: scale(1); }
}

@keyframes tileWobble {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 680px) {
  .topbar { padding: 10px 14px; }
  .container { padding: 14px 12px 48px; }
  .card, .blackboard { padding: 16px; }
  .magnet-tile { min-width: 60px; padding: 8px 14px; font-size: 20px; }
}

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border-color: #94a3b8; }
}
</style>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true">哒</span>
      <div>
        <div class="brand-title">词哒 <span class="brand-en">SnapWord</span></div>
        <div class="brand-sub">开口读准 · 咔嗒拆词 · 红笔落纸</div>
      </div>
    </div>

    <nav class="main-nav" aria-label="主导航">
      <button type="button" class="nav-btn active" data-nav="learn">🚀 今日闯关</button>
      <button type="button" class="nav-btn" data-nav="vault">🏅 徽章图鉴</button>
      <button type="button" class="nav-btn" data-nav="ledger">📒 复测与错题</button>
      <button type="button" class="nav-btn" data-nav="prep">🧰 爸爸排课台</button>

  <script>/* 词哒 · SnapWord Core Pedagogical & Ledger Engine (v0.1.1)

 * - F01: Mandatory explicit judgment ('unjudged' never auto-passes); 1/4 denominator (blank in denominator; untested & pending_verify separate); idempotent session records; full provenance.
 * - F02: Tracks hadSpellingHint so hinted items never count as unassisted paper_independent.

 * - F04: Strict D0-anchored checkpoints (D0+1, D0+3, D0+7 -> stabilized low-freq pool); same-night pass after error stays in review; Gold preserved with recentSlip flag on subsequent error.
 * - F05: Separates textbook_wordlist (exact 24 Unit 6 items: 19 core + 5 starred) vs foundation_bridge; connects textbookCore + classRequirement + sessionActivity without silent truncation; context/variant-aware answer resolution.

const SnapCore = (() => {
  const clone = x => JSON.parse(JSON.stringify(x));

  function normText(s) {
    return String(s ?? '').trim().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
  }

  function todayISO(nowMs = Date.now()) {
    const d = new Date(nowMs);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function addDaysISO(dateStr, days) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + days));
    return dt.toISOString().slice(0, 10);
  }

  function maxISO(a, b) {
    return a >= b ? a : b;

    const rand = typeof crypto !== 'undefined' && crypto.randomUUID

    return /[A-Z]/.test(str);

  // Context & class-setting aware target answer resolver (F05)
  function getTargetAnswers(item, options = {}) {
    const mode = options.promptMode || 'zh_prompt';
    const allowUS = Boolean(options.allowAmericanSpelling);

    if (mode === 'sentence_context' && item.sentencePrompt?.expected) {
      const primary = normText(item.sentencePrompt.expected);
      const list = [primary];
      if (allowUS && item.usVariant && primary === normText(item.en)) {
        list.push(normText(item.usVariant));
      }
      return { primary, accepted: [...new Set(list)] };
    }

    const primary = normText(item.en);
    const list = [primary, ...(item.acceptedVariants || []).map(normText)];
    if (allowUS && item.usVariant) list.push(normText(item.usVariant));
    if (options.allowSelfPronoun && item.selfVariant) list.push(normText(item.selfVariant));
    return { primary, accepted: [...new Set(list)] };
  }

  function judgeSpelling(item, rawInput, options = {}) {
    const input = normText(rawInput);
    if (!input) return { ok: false, kind: 'blank', suggestedTag: null };

    const { primary, accepted } = getTargetAnswers(item, options);
    const strictCase = accepted.some(hasRequiredCapital);

    for (let i = 0; i < accepted.length; i++) {
      const t = accepted[i];
      if (input === t || (!strictCase && input.toLowerCase() === t.toLowerCase())) {
        return {
          ok: true,
          kind: t === primary || (!strictCase && t.toLowerCase() === primary.toLowerCase()) ? 'exact' : 'variant',

    for (const t of accepted) {

      outcome: finalOutcome,
      errorTags: Array.isArray(payload.errorTags) ? [...new Set(payload.errorTags)] : [],
      note: String(payload.note ?? '').slice(0, 300)
    };

    if (existingIdx >= 0) {
      state.events[existingIdx] = evt;
      rebuildMastery(state);
    } else {
      state.events.push(evt);
      if (actor === 'student') {
        const updated = applyEventToMastery(state.mastery[evt.itemId], evt);
        if (updated) state.mastery[evt.itemId] = updated;
      }
    }
    return evt;
  }

  function resolvePendingVerify(state, eventId, finalOutcome, errorTags = [], note = '') {
    const evt = state.events.find(e => e.id === eventId);
    if (!evt || !VERIFIED_DENOMINATOR_OUTCOMES.has(finalOutcome)) return null;
    evt.outcome = normalizePaperOutcome(finalOutcome, evt.hadSpellingHint);
    evt.errorTags = Array.isArray(errorTags) ? [...new Set(errorTags)] : [];
    evt.verificationStatus = 'verified';
    evt.verifiedBy = 'parent';
    evt.rev = (evt.rev || 1) + 1;
    evt.updatedAt = Date.now();
    if (note) evt.note = String(note).slice(0, 300);
    rebuildMastery(state);
    return evt;
  }

  // F01: Exact batch tally helper (used by both session settlement and ledger)
  function summarizePaperEvents(events) {
    let independent = 0;
    let hintedCorrect = 0;
    let blindSelfFixed = 0;
    let answerCorrected = 0;
    let answeredWrong = 0;
    let blank = 0;
    let untested = 0;
    let pendingVerify = 0;

    for (const e of events) {
      if (e.taskType !== 'paper_check') continue;
      if (e.verificationStatus === 'pending' || e.outcome === 'pending_verify') {
        pendingVerify++;
        continue;
      }
      switch (e.outcome) {
        case 'paper_independent': independent++; break;
        case 'hinted_correct': hintedCorrect++; break;
        case 'blind_self_fixed': blindSelfFixed++; break;
        case 'answer_corrected': answerCorrected++; break;
        case 'answered_wrong': answeredWrong++; break;
        case 'blank': blank++; break;
        case 'untested': untested++; break;
        default: break;
      }
    }

    const denominator = independent + hintedCorrect + blindSelfFixed + answerCorrected + answeredWrong + blank;
    return {
      independent,
      hintedCorrect,
      blindSelfFixed,
      answerCorrected,
      answeredWrong,
      blank,
      untested,
      pendingVerify,
      denominator,
      ratioText: `${independent} / ${denominator}`
    };
  }

  // F04: Due queue (priority 1: needsReview / recentSlip; priority 2: D0+1/3/7 due; separate lowFreqPool for stabilized)
  function getDueQueue(state, dateStr = todayISO(), limit = 3) {
    const candidates = [];
    const lowFreqPool = [];

    for (const item of state.items) {
      const m = state.mastery[item.id];
      if (!m) continue;
      if (m.stabilized && !m.needsReview) {
        lowFreqPool.push({ item, m });
        continue;
      }
      if (m.needsReview) {
        const reason = m.recentSlip
          ? '最近失手，下次课优先复测'
          : '上次订正/含提示/留白，优先独立复测';
        candidates.push({ item, m, priority: 1, reason });
      } else if (m.nextDueDate && m.nextDueDate <= dateStr) {
        const label = m.checkpointIdx === 1 ? `D+1 隔日抽查（D0=${m.anchorD0}）`
          : m.checkpointIdx === 2 ? `D+3 巩固抽查（D0=${m.anchorD0}）`
          : `D+7 稳定抽查（D0=${m.anchorD0}）`;
        candidates.push({ item, m, priority: 2, reason: label });
      }
    }

    candidates.sort((a, b) =>
      a.priority - b.priority ||
      String(a.m.nextDueDate || '').localeCompare(String(b.m.nextDueDate || '')) ||
      (a.m.lastAt - b.m.lastAt)
    );

    return {
      todayPick: candidates.slice(0, limit),
      allDue: candidates,
      totalDue: candidates.length,
      lowFreqPool
    };
  }

  function getStatsSummary(state) {
    let bronze = 0, silver = 0, gold = 0, goldSlip = 0, stabilizedCount = 0;
    for (const item of state.items) {
      const m = state.mastery[item.id];
      const b = m?.badge || 'none';
      if (b === 'bronze') bronze++;
      else if (b === 'silver') silver++;
      else if (b === 'gold') {
        gold++;
        if (m?.recentSlip) goldSlip++;
      }
      if (m?.stabilized) stabilizedCount++;
    }

    const studentPaperEvents = state.events.filter(e => e.actor === 'student' && e.taskType === 'paper_check');
    const paperBreakdown = summarizePaperEvents(studentPaperEvents);

    const errorTotals = {};
    for (const e of state.events) {
      if (e.actor !== 'student' || e.verificationStatus === 'pending') continue;
      for (const t of (e.errorTags || [])) {
        errorTotals[t] = (errorTotals[t] || 0) + 1;
      }
    }

    return {
      bronze,
      silver,
      gold,
      goldSlip,
      stabilizedCount,
      totalBadges: bronze + silver + gold,
      paperTestedCount: paperBreakdown.denominator,
      independentPass: paperBreakdown.independent,
      blankCount: paperBreakdown.blank,
      untestedCount: paperBreakdown.untested,
      pendingVerifyCount: paperBreakdown.pendingVerify,
      paperRatioText: paperBreakdown.ratioText,
      errorTotals
    };
  }

  // F05: Derive default session activity from classRequirement + textbookCore + packOverrides
  function defaultActivityForItem(item, packOverride) {
    if (packOverride) return packOverride;
    if (item.classRequirement === 'dictation_verified') return 'paper_dictation';
    if (item.classRequirement === 'read_meaning_use') return 'oral_only';
    // 'unverified_family': default core/custom/bridge words selected in a pack to practice dictation, starred to oral
    return item.textbookCore === false && item.sourceScope === 'textbook_wordlist'
      ? 'oral_only'
      : 'paper_dictation';
  }

  function planPackAllocation(state, packId, itemIds, options = {}) {
    const totalPaperCap = options.totalPaperCap ?? 5;
    const dueIds = options.dueIds || [];
    const remainingPaperSlots = Math.max(1, totalPaperCap - dueIds.length);
    const overrides = state.packOverrides?.[packId] || {};

    const paperNowIds = [];
    const oralOnlyIds = [];
    const deferredIds = [];

    for (const id of itemIds) {
      if (dueIds.includes(id)) continue;
      const it = state.items.find(x => x.id === id);
      if (!it) continue;
      const act = defaultActivityForItem(it, overrides[id]);
      if (act === 'oral_only') {
        oralOnlyIds.push(id);
      } else if (act === 'next_candidate') {
        deferredIds.push(id);
      } else {
        if (paperNowIds.length < remainingPaperSlots) {
          paperNowIds.push(id);
        } else {
          deferredIds.push(id);
        }
      }
    }

    return {
      dueIds: [...dueIds],
      paperNowIds,
      oralOnlyIds,
      deferredIds,
      combinedPaperIds: [...dueIds, ...paperNowIds]
    };
  }

  // Update item with version archive (F06)
  function updateCurriculumItem(state, itemId, patch) {
    const idx = state.items.findIndex(x => x.id === itemId);
    if (idx < 0) return null;
    const current = state.items[idx];
    const contentChanged = (patch.en && normText(patch.en) !== normText(current.en)) ||
      (patch.zh && normText(patch.zh) !== normText(current.zh));

    if (contentChanged) {
      state.itemHistory = state.itemHistory || [];
      state.itemHistory.push({
        id: current.id,
        version: current.version || 1,
        en: current.en,
        zh: current.zh,
        acceptedVariants: clone(current.acceptedVariants || []),
        archivedAt: Date.now()
      });
    }

    const updated = {
      ...current,
      ...patch,
      version: contentChanged ? (current.version || 1) + 1 : (current.version || 1)
    };
    state.items[idx] = updated;
    return updated;
  }

  function suggestItemFromPair(enRaw, zhRaw, index = 0) {
    const en = normText(enRaw);
    const zh = normText(zhRaw);
    const isPhrase = en.includes(' ');
    let pieces = [];
    let cloze = null;

    if (isPhrase) {
      const words = en.split(' ');
      words.forEach((w, idx) => {
        if (idx > 0) pieces.push('␣');
        pieces.push(w);
      });
      const lastWord = words[words.length - 1];
      const prefix = words.slice(0, -1).join(' ') + ' ';
      cloze = { prefix, blank: lastWord, suffix: '', hint: '补全最后一个词' };
    } else if (en.length <= 4) {
      pieces = [en.slice(0, Math.ceil(en.length / 2)), en.slice(Math.ceil(en.length / 2))].filter(Boolean);
      cloze = { prefix: en[0], blank: en.slice(1), suffix: '', hint: '补全剩余字母' };
    } else {
      const cut1 = Math.max(2, Math.floor(en.length / 3));
      const cut2 = Math.max(cut1 + 1, Math.floor((en.length * 2) / 3));
      pieces = [en.slice(0, cut1), en.slice(cut1, cut2), en.slice(cut2)].filter(Boolean);
      cloze = { prefix: en.slice(0, cut1), blank: en.slice(cut1, cut2), suffix: en.slice(cut2), hint: '补全中间容易漏掉的一截' };
    }

    const decoys = [];
    if (hasRequiredCapital(en[0])) {
      decoys.push({ text: pieces[0].toLowerCase(), tip: '🎩 这个词开头需要首字母大写哦！' });
    }
    if (isPhrase) {
      decoys.push({ text: en.replace(/\s+/g, ''), tip: '✂️ 词与词之间记得留出空格 ␣ 哦！' });
    }

    return {
      id: uid('custom_' + index),
      version: 1,
      unit: 0,
      sourceScope: 'custom',
      bookPage: null,
      textbookCore: false,
      classRequirement: 'unverified_family',
      type: isPhrase ? 'phrase' : 'word',
      en,
      acceptedVariants: [],
      zh,
      helpKind: isPhrase ? 'word_boundary' : 'spelling_focus',
      displayChunks: isPhrase ? en.replace(/\s+/g, ' ␣ ') : pieces.join(' ｜ '),
      helpNote: isPhrase ? '先整句听读，注意词间留空。' : '先整词听读，留意分段拼写难点。',
      bridgeNote: '家庭试排练习词条（可在词库标注本班要求）。',
      snap: { pieces, decoys },
      cloze,
      sentencePrompt: { template: `Please write: ______ (${zh})`, zh, expected: en },
      context: { en, zh, origin: '家长自定义任务' }
    };
  }

  function parseQuickLessonLines(rawText) {
    const lines = String(rawText ?? '')
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(Boolean);
    if (!lines.length) throw new Error('请输入至少一行“英文 | 中文”内容');
    if (lines.length > 40) throw new Error('单次快速粘贴最多支持 40 项（可勾选分配当晚纸写与下轮候选）');

    const seen = new Set();
    return lines.map((line, i) => {
      const parts = line.split(/[|｜\t]/).map(s => s.trim());
      if (parts.length < 2 || !parts[0] || !parts[1]) {
        throw new Error(`第 ${i + 1} 行格式有误，请按“英文 | 中文”填写`);
      }
      const key = normText(parts[0]).toLowerCase();
      if (seen.has(key)) throw new Error(`第 ${i + 1} 行「${parts[0]}」在本组中重复了`);
      seen.add(key);
      return { en: normText(parts[0]), zh: normText(parts[1]) };
    });
  }

  function eventContentEqual(a, b) {
    return a.outcome === b.outcome &&
      a.verificationStatus === b.verificationStatus &&
      JSON.stringify(a.errorTags || []) === JSON.stringify(b.errorTags || []) &&
      (a.note || '') === (b.note || '');
  }

  // F03 + F06: Restore local machine snapshot (preserves actorMode, selectedPackId, activeDraft, boardNotes!)
  function restoreLocalState(curriculum, saved) {
    const base = freshState(curriculum);
    if (!saved || saved.app !== 'snapword') return base;

    const merged = mergeSnapwordBackup(base, saved, { includeDemo: true, conflictPolicy: 'prefer_incoming' });
    merged.actorMode = saved.actorMode === 'parent_demo' ? 'parent_demo' : 'student';
    if (saved.selectedPackId && merged.packs.some(p => p.id === saved.selectedPackId)) {
      merged.selectedPackId = saved.selectedPackId;
    }
    if (saved.packOverrides && typeof saved.packOverrides === 'object') {
      merged.packOverrides = clone(saved.packOverrides);
    }
    if (saved.classSettings && typeof saved.classSettings === 'object') {
      merged.classSettings = { ...merged.classSettings, ...saved.classSettings };
    }
    if (saved.audioCheckLog) {
      merged.audioCheckLog = clone(saved.audioCheckLog);
    }
    if (saved.activeDraft && saved.activeDraft.lockedActor === merged.actorMode) {
      merged.activeDraft = clone(saved.activeDraft);
    } else {
      merged.activeDraft = null;
    }
    return merged;
  }

  // F06: Detailed 4-way diff preview for SnapWord backups + Legacy isolation
  function inspectBackupJSON(rawObj, currentState) {
    if (!rawObj || typeof rawObj !== 'object') throw new Error('不是有效的 JSON 备份文件');

    if (rawObj.app === 'snapword' && rawObj.schema === 1) {
      if (!Array.isArray(rawObj.items) || !Array.isArray(rawObj.packs) || !Array.isArray(rawObj.events)) {
        throw new Error('词哒备份结构不完整');
      }
      const localMap = new Map(currentState.events.map(e => [e.id, e]));
      const studentEvents = rawObj.events.filter(e => e.actor === 'student');
      const demoEvents = rawObj.events.filter(e => e.actor !== 'student');

      let added = 0, identical = 0, verifiedUpgrades = 0, conflicts = 0;
      for (const inc of studentEvents) {
        const loc = localMap.get(inc.id);
        if (!loc) {
          added++;
        } else if (eventContentEqual(loc, inc)) {
          identical++;
        } else if (loc.verificationStatus === 'pending' && inc.verificationStatus === 'verified') {
          verifiedUpgrades++;
        } else if (inc.verificationStatus === 'pending' && loc.verificationStatus === 'verified') {
          identical++; // Local is already verified; keep local without conflict
        } else {
          conflicts++;
        }
      }

      return {
        kind: 'snapword',
        itemCount: rawObj.items.length,
        packCount: rawObj.packs.length,
        studentEventCount: studentEvents.length,
        demoEventCount: demoEvents.length,
        added,
        identical,
        verifiedUpgrades,
        conflicts,
        payload: rawObj
      };
    }

    if (rawObj.schema === 1 && Array.isArray(rawObj.words) && Array.isArray(rawObj.events)) {
      return {
        kind: 'legacy_extraction',
        wordCount: rawObj.words.length,
        typingEventCount: rawObj.events.length,
        warning: '检测到旧版《词汇撤离》备份。词条将提取至扩展词库；旧键盘打字记录将独立保存在「旧版键盘归档区」，绝不混入学生纸笔正式账本。',
        payload: rawObj
      };
    }

    throw new Error('无法识别的备份格式（仅支持词哒 SnapWord 或旧版词汇撤离 JSON）');
  }

  // F03 + F06: Cross-device backup merge (NEVER overwrites local actorMode!)
  function mergeSnapwordBackup(currentState, backupObj, options = {}) {
    const includeDemo = Boolean(options.includeDemo);
    const conflictPolicy = options.conflictPolicy || 'prefer_incoming'; // 'prefer_incoming' | 'keep_local'
    const next = clone(currentState);
    const preservedActorMode = next.actorMode; // F03: Keep local machine's selected role!

    if (backupObj.profile?.nickname) next.profile.nickname = String(backupObj.profile.nickname).slice(0, 24);
    if (Number.isFinite(backupObj.profile?.budgetMinutes)) next.profile.budgetMinutes = backupObj.profile.budgetMinutes;
    if (backupObj.classSettings && typeof backupObj.classSettings === 'object') {
      next.classSettings = { ...next.classSettings, ...backupObj.classSettings };
    }
    if (backupObj.packOverrides && typeof backupObj.packOverrides === 'object') {
      next.packOverrides = { ...next.packOverrides, ...backupObj.packOverrides };
    }

    // Merge itemHistory
    const histKey = h => `${h.id}@v${h.version}`;
    const histMap = new Map((next.itemHistory || []).map(h => [histKey(h), h]));
    for (const h of (backupObj.itemHistory || [])) {
      if (h?.id) histMap.set(histKey(h), h);
    }
    next.itemHistory = [...histMap.values()];

    // Merge items (preserve user classRequirement edits and higher versions)
    const itemMap = new Map(next.items.map(it => [it.id, it]));
    for (const it of backupObj.items) {
      if (!it?.id || !it?.en) continue;
      const existing = itemMap.get(it.id);
      if (!existing) {
        itemMap.set(it.id, it);
      } else if ((it.version || 1) > (existing.version || 1)) {
        // Archive older version if not yet archived
        if (!histMap.has(histKey(existing))) {
          next.itemHistory.push({
            id: existing.id,
            version: existing.version || 1,
            en: existing.en,
            zh: existing.zh,
            acceptedVariants: clone(existing.acceptedVariants || []),
            archivedAt: Date.now()
          });
        }
        itemMap.set(it.id, it);
      } else if ((it.version || 1) === (existing.version || 1) && it.classRequirement) {
        itemMap.set(it.id, { ...existing, classRequirement: it.classRequirement });
      }
    }
    next.items = [...itemMap.values()];

    // Merge packs
    const packMap = new Map(next.packs.map(p => [p.id, p]));
    for (const p of backupObj.packs) {
      if (p?.id && Array.isArray(p.itemIds)) packMap.set(p.id, p);
    }
    next.packs = [...packMap.values()];

    // Merge boardNotes (F06 fix!)
    if (Array.isArray(backupObj.boardNotes)) {
      const noteMap = new Map((next.boardNotes || []).map(n => [n.id, n]));
      for (const n of backupObj.boardNotes) {
        if (n?.id && n?.en) noteMap.set(n.id, n);
      }
      next.boardNotes = [...noteMap.values()].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 30);
    }

    // Merge events with pending -> verified upgrade & conflict policy (F06 fix!)
    const eventMap = new Map(next.events.map(e => [e.id, e]));
    for (const inc of backupObj.events) {
      if (!inc?.id || !inc?.itemId) continue;
      if (!includeDemo && inc.actor !== 'student') continue;
      const loc = eventMap.get(inc.id);
      if (!loc) {
        eventMap.set(inc.id, inc);
      } else if (eventContentEqual(loc, inc)) {
        continue;
      } else if (loc.verificationStatus === 'pending' && inc.verificationStatus === 'verified') {
        // Always upgrade pending -> verified!
        eventMap.set(inc.id, { ...inc, rev: Math.max((loc.rev || 1) + 1, inc.rev || 2) });
      } else if (inc.verificationStatus === 'pending' && loc.verificationStatus === 'verified') {
        continue; // Keep local verified
      } else if ((inc.rev || 1) > (loc.rev || 1)) {
        eventMap.set(inc.id, inc);
      } else if ((inc.rev || 1) === (loc.rev || 1) && conflictPolicy === 'prefer_incoming') {
        eventMap.set(inc.id, inc);
      }
    }
    next.events = [...eventMap.values()].sort((a, b) => (a.timestamp - b.timestamp) || String(a.id).localeCompare(String(b.id)));

    if (backupObj.recordings && typeof backupObj.recordings === 'object') {
      next.recordings = { ...next.recordings, ...backupObj.recordings };
    }
    if (Array.isArray(backupObj.legacyTypingArchive) && backupObj.legacyTypingArchive.length) {
      const archIds = new Set((next.legacyTypingArchive || []).map(x => x.id));
      for (const x of backupObj.legacyTypingArchive) {
        if (x?.id && !archIds.has(x.id)) {
          next.legacyTypingArchive.push(x);
          archIds.add(x.id);
        }
      }
    }

    next.actorMode = preservedActorMode;
    rebuildMastery(next);
    return next;
  }

  function importLegacyWordsOnly(currentState, legacyObj) {
    const next = clone(currentState);
    const knownEn = new Set(next.items.map(i => normText(i.en).toLowerCase()));
    const matchedOrAddedIds = [];

    legacyObj.words.forEach((w, idx) => {
      if (!w?.en || !w?.zh) return;
      const key = normText(w.en).toLowerCase();
      const existing = next.items.find(i => normText(i.en).toLowerCase() === key);
      if (existing) {
        matchedOrAddedIds.push(existing.id);
      } else if (!knownEn.has(key)) {
        const created = suggestItemFromPair(w.en, w.zh, idx);
        if (w.tip) created.helpNote = String(w.tip);
        next.items.push(created);
        knownEn.add(key);
        matchedOrAddedIds.push(created.id);
      }
    });

    // Store legacy typing events separately in legacyTypingArchive (never mixed into paper events)
    next.legacyTypingArchive = next.legacyTypingArchive || [];
    const seenArch = new Set(next.legacyTypingArchive.map(x => x.id));
    for (const ev of (legacyObj.events || [])) {
      if (ev?.id && !seenArch.has(ev.id)) {
        next.legacyTypingArchive.push({ ...ev, archivedFrom: 'legacy_extraction' });
        seenArch.add(ev.id);
      }
    }

    if (matchedOrAddedIds.length) {
      const packId = 'pack-legacy-' + todayISO();
      next.packs = next.packs.filter(p => p.id !== packId);
      next.packs.unshift({
        id: packId,
        title: '迁入词单 · 来自旧版备份',
        subtitle: `共关联词条 ${matchedOrAddedIds.length} 项（旧打字记录已独立归档隔离）`,
        modeHint: 'standard',
        itemIds: matchedOrAddedIds
      });
      next.selectedPackId = packId;
    }
    return next;
  }

  return {
    clone,
    normText,
    todayISO,
    addDaysISO,
    uid,
    VERIFIED_DENOMINATOR_OUTCOMES,
    getTargetAnswers,
    judgeSpelling,
    freshState,
    restoreLocalState,
    rebuildMastery,
    recordEvent,
    resolvePendingVerify,
    summarizePaperEvents,
    getDueQueue,
    getStatsSummary,
    defaultActivityForItem,
    planPackAllocation,
    updateCurriculumItem,
    suggestItemFromPair,
    parseQuickLessonLines,
    inspectBackupJSON,
    mergeSnapwordBackup,
    importLegacyWordsOnly
  };
})();

if (typeof module !== 'undefined') module.exports = SnapCore;
</script>
  <script>/* 词哒 · SnapWord Audio Subsystem (v0.1.0)
 * Pure human/TTS pronunciation without noisy background SFX (safe for concurrent WeChat speakerphone calls).
 * Explicitly labels audio source: 家长自带录音 / 内置真人发音(CC) / 系统合成朗读 / 家长范读兜底.
 */
const SnapAudio = (() => {
  let activeAudio = null;
  let activeUtterance = null;
  let seq = 0;

  function findBundledRecord(text) {
    if (typeof SNAPWORD_AUDIO_CLIPS === 'undefined' || !SNAPWORD_AUDIO_CLIPS) return null;
    const raw = String(text ?? '').trim();
    if (Object.hasOwn(SNAPWORD_AUDIO_CLIPS, raw)) return SNAPWORD_AUDIO_CLIPS[raw];
    const lower = raw.toLowerCase();
    for (const [k, val] of Object.entries(SNAPWORD_AUDIO_CLIPS)) {
      if (k.toLowerCase() === lower) return val;
    }
    return null;
  }

  function resolveSourceInfo(state, itemOrText) {
    if (typeof itemOrText === 'object' && itemOrText !== null) {
      const custom = state?.recordings?.[itemOrText.id];
      if (custom) {
        return { kind: 'custom', label: '🎙️ 家长自带录音', data: custom, text: itemOrText.en };
      }
      const bundled = findBundledRecord(itemOrText.en);
      if (bundled) {
        return { kind: 'human_cc', label: '🔊 内置真人发音 (CC)', data: bundled.data, meta: bundled, text: itemOrText.en };
      }
      return { kind: 'tts', label: '🤖 系统合成朗读（建议爸爸听核）', data: null, text: itemOrText.en };
    }
    const text = String(itemOrText ?? '').trim();
    const bundled = findBundledRecord(text);
    if (bundled) {
      return { kind: 'human_cc', label: '🔊 内置真人发音 (CC)', data: bundled.data, meta: bundled, text };
    }
    return { kind: 'tts', label: '🤖 系统合成朗读', data: null, text };
  }

  function stop() {
    seq++;
    if (activeAudio) {
      try { activeAudio.pause(); } catch {}
      activeAudio = null;
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch {}
    }
    activeUtterance = null;
  }

  function speakTTS(text, token, onNotice) {
    if (token !== seq) return;
    const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
      onNotice?.('当前浏览器未提供系统朗读，请直接由爸爸在视频中口头范读即可。');
      return;
    }
    const voices = (synth.getVoices?.() || []).filter(v => /^en(?:[-_]|$)/i.test(v.lang));
    const chosen = voices.find(v => v.localService && /^en[-_]GB$/i.test(v.lang))
      || voices.find(v => v.localService)
      || voices.find(v => /^en[-_]GB$/i.test(v.lang))
      || voices[0];

    const u = new SpeechSynthesisUtterance(text);
    if (chosen) u.voice = chosen;
    u.lang = chosen?.lang || 'en-GB';
    u.rate = 0.85;
    u.onend = () => { if (activeUtterance === u) activeUtterance = null; };
    u.onerror = e => {
      if (activeUtterance === u) activeUtterance = null;
      if (token === seq && !['canceled', 'interrupted'].includes(e?.error)) {
        onNotice?.('系统朗读未能播放，可由爸爸直接口头范读，不影响继续练习。');
      }
    };
    activeUtterance = u;
    try {
      synth.speak(u);
    } catch {
      activeUtterance = null;
      onNotice?.('系统语音暂不可用，请由爸爸口头范读。');
    }
  }

  function play(state, itemOrText, onNotice) {
    stop();
    const info = resolveSourceInfo(state, itemOrText);
    if (!info.text) return info;
    const token = seq;

    if (info.data) {
      const player = new Audio(info.data);
      activeAudio = player;
      player.onended = () => { if (activeAudio === player) activeAudio = null; };
      player.play().catch(() => {
        if (activeAudio === player && token === seq) {
          activeAudio = null;
          speakTTS(info.text, token, onNotice);
        }
      });
      return info;
    }

    speakTTS(info.text, token, onNotice);
    return info;
  }

  async function validateAndEncodeAudioFile(file) {
    if (!file) throw new Error('请选择音频文件');
    const ext = file.name.split('.').pop().toLowerCase();
    const mime = { mp3: 'mpeg', wav: 'wav', ogg: 'ogg' }[ext];
    if (!mime || file.size < 16 || file.size > 500 * 1024) {
      throw new Error('请选择 500 KB 以内的 MP3、WAV 或 OGG 录音文件');
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    const head = String.fromCharCode(...bytes.slice(0, 12));
    const valid = mime === 'wav' ? head.startsWith('RIFF') && head.endsWith('WAVE')
      : mime === 'ogg' ? head.startsWith('OggS')
      : head.startsWith('ID3') || (bytes[0] === 255 && (bytes[1] & 224) === 224);
    if (!valid) throw new Error('音频文件头格式不匹配，请检查文件是否损坏');

    const chunks = [];
    for (let i = 0; i < bytes.length; i += 8192) {
      chunks.push(String.fromCharCode(...bytes.subarray(i, i + 8192)));
    }
    return `data:audio/${mime};base64,${btoa(chunks.join(''))}`;
  }

  function isPlaying() {
    return Boolean((activeAudio && !activeAudio.paused && !activeAudio.ended) || activeUtterance);
  }

  return {
    resolveSourceInfo,
    play,
    stop,
    isPlaying,
    validateAndEncodeAudioFile
  };
})();

if (typeof module !== 'undefined') module.exports = SnapAudio;
